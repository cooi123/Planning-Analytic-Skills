# ---------------------------------------------------------------------------
# Check registry. This is the standard BOTH pa-model-design (self-check) and
# pa-model-review (verification) apply, so the two cannot drift apart.
#
# Add a check = add an entry. No skill prose changes.
#
# severity : critical | warning | info   (blocking behaviour from config.review)
# phase    : design (spec only) | build (server only) | both
# applies_to: dimension | cube | rule | feeder | process | view | security | naming
# config_ref: the conventions key that switches or parameterises this check
# ---------------------------------------------------------------------------
schema_version: 1

checks:

  # ---- Dimensions ----
  - id: DIM-001
    severity: critical
    phase: both
    applies_to: dimension
    title: Leaf grain is stated and consistent
    detect: A dimension has no declared leaf_grain, or cubes disagree about what one leaf represents.
    fix: State the leaf grain in the spec. If two cubes need different grains, they need different dimensions.

  - id: DIM-002
    severity: warning
    phase: both
    applies_to: dimension
    title: Single top-level consolidation exists
    detect: A dimension has no single "All" member covering every leaf.
    fix: Add a top consolidation so views and rules have a total to reference.

  - id: DIM-003
    severity: critical
    phase: both
    applies_to: dimension
    title: No member is both input and consolidation
    detect: A member has children and also receives loaded or entered values.
    fix: Split into a leaf sibling plus the consolidation. Otherwise the value double-counts.

  - id: DIM-004
    severity: warning
    phase: design
    applies_to: dimension
    title: Time carries a quarter rollup
    detect: Monthly time dimension with no quarter level.
    fix: Add the quarter rollup now. Retrofitting means rebuilding the dimension.
    config_ref: modelling.time.include_quarter_rollup

  - id: DIM-005
    severity: critical
    phase: both
    applies_to: dimension
    title: Fiscal year start is explicit
    detect: Time hierarchy assumes a January start without confirmation.
    fix: Set the start from config and reflect it in quarter grouping.
    config_ref: modelling.time.fiscal_year_start_month

  - id: DIM-006
    severity: info
    phase: design
    applies_to: dimension
    title: Member-varying logic uses attributes
    detect: A rule or process branches on literal element names.
    fix: Move the variation to an attribute and write one generic rule.

  - id: DIM-007
    severity: critical
    phase: both
    applies_to: dimension
    title: Sign convention matches consolidation weights
    detect: >-
      Cost branches roll up at weight +1 while costs are stored positive, or at -1
      while stored negative, so a total adds cost to revenue. Or the convention is not
      recorded in the spec.
    fix: >-
      Read the weights, sample a loaded cost line, and record the convention. Variance
      formulas and agent instructions are wrong in every line without it.

  - id: DIM-008
    severity: critical
    phase: both
    applies_to: dimension
    title: Mixed-level consolidations keep their direct leaves
    detect: >-
      A consolidation has both leaf and consolidated children, and a load scope,
      subset or script that walks the hierarchy covers only one kind.
    fix: >-
      Treat any consolidation with at least one direct leaf as a reporting line and
      also recurse into it. Dropped leaves show up as a total with the wrong sign or
      far too small.

  - id: DIM-009
    severity: critical
    phase: both
    applies_to: dimension
    title: Sibling rollups of one family are built the same way
    detect: >-
      Consolidations in one family, such as rolling-3 periods or quarters, have
      different child counts or skip a member every sibling should contain.
    fix: >-
      Rebuild the family. Until then keep it out of every subset and view, and tell
      users and agents it is broken.

  - id: DIM-010
    severity: warning
    phase: both
    applies_to: dimension
    title: Period-to-date consolidations carry only period leaves
    detect: >-
      A YTD consolidation includes an opening-balance or other non-period member, and
      that member holds data for a flow measure. Or YTD members are loaded directly.
    fix: >-
      Load monthly leaves only and leave the opening-balance member empty for P&L.
      Loading YTD directly double-counts.

  - id: DIM-011
    severity: warning
    phase: build
    applies_to: dimension
    title: Members sit under the parent their code implies
    detect: >-
      A member whose code embeds a parent key, such as a store number, rolls up to a
      different parent. Or an accounting construct sits among operating units.
    fix: >-
      Move it, exclude it from the load, or footnote every total it affects. A silent
      cross-parent member makes one entity's total not like-for-like with its peers.

  # ---- Cubes ----
  - id: CUB-001
    severity: warning
    phase: both
    applies_to: cube
    title: Dimension count within limit
    detect: Cube dimension count exceeds the configured maximum.
    fix: Usually two grains fused. Look for a dimension meaningful to only some measures.
    config_ref: review.thresholds.max_cube_dimensions

  - id: CUB-002
    severity: warning
    phase: both
    applies_to: cube
    title: Dimension order follows policy
    detect: Order does not match the configured policy, or no rationale is recorded.
    fix: Apply the policy and record which goal the order optimises. Skip when policy is `manual`.
    config_ref: modelling.dimension_order_policy

  - id: CUB-003
    severity: warning
    phase: both
    applies_to: cube
    title: Measure dimension present
    detect: Cube has no measure dimension while config requires one.
    fix: Add one rather than modelling metrics as separate cubes.
    config_ref: modelling.measure_dimension

  - id: CUB-004
    severity: critical
    phase: both
    applies_to: cube
    title: Calculated measures are protected
    detect: A rule_derived measure is writable by users.
    fix: Apply cell security or input-view design. A typed-over calculated cell disagrees with its own formula.
    config_ref: rules.protect_calculated_measures

  - id: CUB-005
    severity: info
    phase: design
    applies_to: cube
    title: Member counts and density recorded
    detect: estimated_members or density missing from a dimension entry.
    fix: Record both. Dimension order cannot be checked without them.

  - id: CUB-006
    severity: critical
    phase: both
    applies_to: cube
    title: No posting is loaded twice under a common total
    detect: >-
      Two account or entity families carry the same economic posting, such as a
      store sales line and an admin sales line, and both are loaded under one total.
    fix: >-
      Decide which family owns each posting and exclude the duplicate from the load.
      With +1 weights the total double-counts revenue and cost.

  - id: CUB-007
    severity: warning
    phase: both
    applies_to: cube
    title: Non-additive inputs do not sum
    detect: An input measure that is a rate, average, ratio or percentage (fare, price, load factor, change %) is a leaf with no C-level rule, so every consolidation adds it up.
    fix: "Compute it at consolidated levels with a rule from additive components (for example revenue \\ passengers), or keep it at leaf level only and hide its totals. Found in a real review: an average fare summed to 21,384 at network/year level and a monthly change % summed to -58.8 for the year."

  # ---- Rules ----
  - id: RUL-001
    severity: critical
    phase: both
    applies_to: rule
    title: SKIPCHECK present with FEEDERS
    detect: Cube has rules and SKIPCHECK but no FEEDERS section, or FEEDERS precedes the rules.
    fix: Order is FEEDSTRINGS, SKIPCHECK, rules, FEEDERS.
    config_ref: rules.require_skipcheck

  - id: RUL-002
    severity: critical
    phase: both
    applies_to: rule
    title: FEEDSTRINGS present when string rules exist
    detect: A rule returns a string and FEEDSTRINGS is absent or not the first line.
    fix: Make FEEDSTRINGS the literal first line of the rules file.
    config_ref: rules.feedstrings_when_string_rules

  - id: RUL-003
    severity: critical
    phase: both
    applies_to: rule
    title: Consolidated scope is justified
    detect: "A rule scoped C: or unqualified has no recorded justification."
    fix: "Default to N:. Use C: only where the total genuinely is not the sum of its children, and say why."

  - id: RUL-004
    severity: warning
    phase: both
    applies_to: rule
    title: Precedence ordered specific before general
    detect: A broader rule area precedes a narrower one targeting the same cells.
    fix: Reorder. The first match wins and the narrower rule is silently dead.

  - id: RUL-005
    severity: warning
    phase: both
    applies_to: rule
    title: Safe divide used
    detect: A rule divides with / where the denominator can legitimately be zero.
    fix: "Use \\ so an empty denominator yields zero instead of an undefined (N/A) value. Tested on v12: / gives #N/A, \\ gives 0 (over REST the zero reads as a null Value with FormattedValue 0.00)."

  - id: RUL-006
    severity: info
    phase: design
    applies_to: rule
    title: Rule is the right tool
    detect: Rule computes a value that never changes between data loads.
    fix: Consider a TI process. Rules evaluate on every read, forever.

  - id: RUL-007
    severity: warning
    phase: both
    applies_to: rule
    title: Recursive chains are bounded
    detect: A rule reads its own cube's previous period (opening = prior closing) across a chain that can exceed a few hundred steps.
    fix: "Carry balances forward with a TI process at a cycle boundary (for example year-end) so recursion stays within one cycle. Tested on v12: a chain of 600 resolved and 650 returned #N/A with HTTP 200 and no error, so the failure is silent. Rule shape moves the limit."

  # ---- Feeders ----
  - id: FED-001
    severity: critical
    phase: both
    applies_to: feeder
    title: Every leaf rule has a feeder
    detect: "An N: rule has neither a feeder nor a recorded feeder_none_reason."
    fix: Add the feeder. Unfed rule cells read zero in consolidations under SKIPCHECK.
    config_ref: rules.require_feeder_for_every_leaf_rule

  - id: FED-002
    severity: critical
    phase: both
    applies_to: feeder
    title: Cross-cube feeders exist in the source cube
    detect: A rule uses DB() to read another cube with no corresponding feeder in that source cube.
    fix: Add the feeder to the source cube. Most commonly missed, because rule and feeder live in different files.

  - id: FED-003
    severity: warning
    phase: both
    applies_to: feeder
    title: Feeder source is the sparsest operand
    detect: Feeder sources the densely populated operand of a multiplication.
    fix: Feed from the operand most often empty. This is the main lever on model memory.

  - id: FED-004
    severity: warning
    phase: both
    applies_to: feeder
    title: Feeder fan-out within threshold
    detect: Estimated or measured fan-out exceeds the configured maximum without justification.
    fix: Narrow with a conditional feeder mirroring the rule's own condition.
    config_ref: review.thresholds.max_feeder_fanout

  - id: FED-005
    severity: warning
    phase: both
    applies_to: feeder
    title: Feeder source matches what the rule reads
    detect: >-
      A feeder's left side names a consolidation the rule does not read, so every
      leaf under it fires the feeder. Feeding always starts from leaf cells; a
      consolidation on the left that mirrors a rule reading that consolidation
      (IBM's documented cross-cube pattern) is not a finding.
    fix: Narrow the source to the leaves, or to the consolidation the rule actually reads.

  - id: FED-006
    severity: warning
    phase: both
    applies_to: feeder
    title: Feeder target fully qualified
    detect: A feeder target leaves a dimension unqualified, feeding it entirely.
    fix: Qualify every dimension on the target side.

  - id: FED-007
    severity: warning
    phase: both
    applies_to: feeder
    title: Conditional feeder condition is static
    detect: A conditional feeder's IF reads a cell value that can change after the feeder has fired.
    fix: "Use an unconditional feeder, or condition on an element attribute that does not change after load. Tested on v12.6.3: a feeder decided once, and changing the condition (or rewriting the fed value) left the consolidation under-reported."

  # ---- Processes ----
  - id: TI-001
    severity: critical
    phase: both
    applies_to: process
    title: Tab separation respected
    detect: Cell writes in Metadata, or dimension updates in Data.
    fix: Dimension maintenance in Metadata, cell writes in Data.
    config_ref: ti.tab_policy

  - id: TI-002
    severity: critical
    phase: both
    applies_to: process
    title: No hard-coded object names
    detect: A literal server, database, cube, or file path appears in process code.
    fix: Resolve from parameters or a control cube so the process promotes across environments unedited.
    config_ref: ti.forbid_hardcoded_object_names

  - id: TI-003
    severity: warning
    phase: both
    applies_to: process
    title: Parameters validated in Prolog
    detect: Process uses a parameter without checking it before writing anything.
    fix: Validate and reject in Prolog, before partial writes occur.
    config_ref: ti.require_parameters

  - id: TI-004
    severity: warning
    phase: both
    applies_to: process
    title: Temporary views and subsets are per-run
    detect: Process uses a pre-existing named view or subset, or fails to destroy what it created.
    fix: Create uniquely named temporaries in Prolog, destroy in Epilog. Shared objects corrupt concurrent runs.

  - id: TI-005
    severity: warning
    phase: both
    applies_to: process
    title: Process is idempotent
    detect: Re-running changes the result, usually accumulation or no scoped clear.
    fix: "Clear the target scope through a Prolog-built view; prefer CellPutN over CellIncrementN. Tested on v12: CellIncrementN run twice gives double the CellPutN result."

  - id: TI-006
    severity: warning
    phase: both
    applies_to: process
    title: Outcome counts reported
    detect: Process logs nothing about rows read, written, rejected.
    fix: Log counts in Epilog. A process writing nothing must not look like success.
    config_ref: ti.require_error_handling

  - id: TI-007
    severity: info
    phase: both
    applies_to: process
    title: No Boolean variable type assumed
    detect: Code or spec treats a variable as Boolean.
    fix: TI has Numeric and String only. Use numeric 0/1.

  - id: TI-008
    severity: warning
    phase: design
    applies_to: process
    title: One job per process
    detect: A single process loads, transforms, and clears.
    fix: "Split and orchestrate with a chore, so a partial failure can be re-run. Exception: atomic object creation."

  - id: TI-009
    severity: warning
    phase: both
    applies_to: process
    title: Termination function matches the outcome
    detect: ProcessQuit is used for a failure a chore or calling process must see, or cleanup that must always run sits only in the Epilog of a process that can call ProcessQuit or ProcessError.
    fix: "Use ProcessError for failures (status Aborted, caller code 12). ProcessQuit ends as QuitCalled (caller code 9), which is neither success nor Aborted. Neither runs the Epilog on v12, so put must-run cleanup before the stop or in the caller."

  - id: TI-010
    severity: critical
    phase: both
    applies_to: process
    title: Dimension maintenance updates, never rebuilds
    detect: A process calls DimensionDeleteAllElements (or uses the Recreate option) and re-inserts only some elements.
    fix: "Insert and update elements, and delete only the ones that are meant to go. Tested on v12: dropped elements lose their data permanently and the process still ends CompletedSuccessfully."

  - id: TI-011
    severity: info
    phase: both
    applies_to: process
    title: No cube-logging toggles on SaaS
    detect: A process calls CubeSetLogChanges or CubeGetLogChanges.
    fix: "Remove the call and the log-off, load, log-on pattern around it. On v12.6.3 both functions fail to compile (Syntax error ... equal sign not found) and the cube has no LogChanges property over REST."
    config_ref: platform.edition

  # ---- Views ----
  - id: VW-001
    severity: critical
    phase: both
    applies_to: view
    title: Ratio calculated members evaluate last
    detect: >-
      An MDX view has a ratio member, such as a variance %, and another calculated
      member that sums, with the summing member at an equal or higher SOLVE_ORDER.
    fix: >-
      Give ratios the highest SOLVE_ORDER. Otherwise the total sums percentages and
      reports the wrong figure with no error.

  - id: VW-002
    severity: warning
    phase: both
    applies_to: view
    title: Suppression ignores string columns
    detect: A view puts a string calculated member on an axis and suppresses rows with NON EMPTY.
    fix: >-
      Use NONEMPTY(set, {numeric tuple}). A string cell is never empty, so NON EMPTY
      stops suppressing and the view returns every row.

  - id: VW-003
    severity: critical
    phase: both
    applies_to: view
    title: Variance percentage follows the sign convention
    detect: >-
      Costs are stored negative and a variance % divides by the raw base rather than
      ABS() of it, so cost overruns read favourable. Or costs are stored positive and
      no per-line sign is applied.
    fix: Divide by ABS(base) under a costs-negative convention so negative means unfavourable on every line.

  - id: VW-004
    severity: info
    phase: both
    applies_to: view
    title: View-local members and access limits are documented
    detect: >-
      A view holds calculated members that stand in for dimension members, such as
      variance or a site total, and the spec does not say who cannot see them.
    fix: >-
      Record them. Ad-hoc users, the PA MCP data explorer and other cubes cannot see
      view-local members.

  # ---- Security and naming ----
  - id: SEC-001
    severity: critical
    phase: both
    applies_to: security
    title: No credentials in artefacts
    detect: A key, token, password, tenant id, region, or host appears in any spec, config, or process.
    fix: Remove it. Connections come from the MCP session or environment variables.

  - id: SEC-002
    severity: warning
    phase: both
    applies_to: security
    title: Write access is deliberate
    detect: A role has write access to a cube with no recorded reason, or to a prod environment marked read-only.
    fix: Restate intended access per role and cube.

  - id: NAM-001
    severity: warning
    phase: both
    applies_to: naming
    title: Names follow configured templates
    detect: An object name does not match its naming template.
    fix: Rename. Renaming after rules and processes reference the object is materially harder.
    config_ref: naming

  - id: NAM-002
    severity: critical
    phase: both
    applies_to: naming
    title: Control object prefix not used
    detect: A designed or built object uses the reserved control prefix.
    fix: Rename. Those names belong to TM1.
    config_ref: naming.reserved_prefixes.control

  - id: NAM-003
    severity: warning
    phase: both
    applies_to: naming
    title: Aliases are unique and do not shadow element names
    detect: An alias value repeats within the hierarchy, or equals an existing element name.
    fix: >-
      Change the alias text. TM1 rejects the write, or resolves the name to the wrong
      member. Use a String attribute for descriptions that can repeat.

  - id: NAM-004
    severity: info
    phase: build
    applies_to: naming
    title: Element names are clean
    detect: An element name has leading or trailing spaces, a trailing full stop, or a double space.
    fix: >-
      Rename where possible. Otherwise quote names from the server in every script and
      prompt, because an exact-match lookup of the retyped name fails.



  # ---- Health (operational) ----
  - id: HLT-001
    severity: info
    phase: build
    applies_to: cube
    title: Isolated cube is intentional
    detect: Cube has no rule, feeder or TI link to any other cube (graph isolated_cubes)
    fix: Confirm it is a deliberate input or reporting cube; otherwise retire it or link it

  - id: HLT-002
    severity: warning
    phase: build
    applies_to: dimension
    title: No unused dimensions
    detect: Dimension is used by no cube (graph unused_dimensions)
    fix: Delete it after confirming no process builds or reads it

  - id: HLT-003
    severity: warning
    phase: build
    applies_to: process
    title: Every process is scheduled or called
    detect: Process is in no chore and called by no process (graph unscheduled_processes)
    fix: Schedule it, call it from an orchestrating process, or retire it

  - id: HLT-004
    severity: info
    phase: build
    applies_to: process
    title: Dynamic references are documented
    detect: Cube or process names are built at run time (graph dynamic_refs)
    fix: List the possible targets in the design spec so lineage can be reviewed

  - id: HLT-005
    severity: warning
    phase: build
    applies_to: process
    title: Recent process errors reviewed
    detect: "The database holds process error logs (inventory error_logs.count > 0)"
    fix: Read the latest logs; fix or explain each failing process

  - id: HLT-006
    severity: warning
    phase: build
    applies_to: security
    title: Write access is restricted where data is sensitive
    detect: No cell or element security on cubes that hold sensitive or approved data (inventory security)
    fix: Add cell or element security, or record why open access is acceptable

  - id: HLT-007
    severity: info
    phase: build
    applies_to: cube
    title: Stale cubes reviewed
    detect: A cube's last_data_update is far older than the rest of the model
    fix: Confirm it is reference data; otherwise retire it

  - id: HLT-008
    severity: warning
    phase: build
    applies_to: process
    title: Inactive chores reviewed
    detect: A chore is inactive (graph inactive_chores)
    fix: Reactivate it or delete it so the schedule reflects reality

  # ---- Migration v11 -> v12 ----
  - id: MIG-001
    severity: critical
    phase: build
    applies_to: process
    title: No TI functions removed in v12
    detect: "Process code calls any of: ExecuteCommand, CubeSetLogChanges, CubeGetLogChanges, SaveDataAll, CubeSaveData, SetODBCUnicodeInterface, ServerShutdown, ExecuteJavaN, CubeDataReservationAcquire, SetChoreVerboseMessages"
    fix: "Remove or replace before migrating; on v12.6.3 each fails to compile (equal sign not found or Variable '...' is undefined) so the whole process aborts"

  - id: MIG-002
    severity: critical
    phase: build
    applies_to: process
    title: No local file system paths
    detect: "Process code or datasource contains a drive letter path (X:\\), a UNC path (\\\\server\\), or an absolute OS path"
    fix: "Move files to the database's Files area and use relative names. Absolute and UNC paths were not tested on v12; test before relying on them."

  - id: MIG-003
    severity: warning
    phase: build
    applies_to: process
    title: ODBC sources reviewed for v12
    detect: Process uses ODBCOpen/ODBCOutput or an ODBC datasource
    fix: "These compile on v12 but need the v12 ODBC Data Connector at run time; see ../pa-ti/references/data-sources.md"

  - id: MIG-004
    severity: warning
    phase: build
    applies_to: process
    title: Debug and output files reviewed
    detect: Process writes files with ASCIIOutput/TextOutput or reads GetProcessErrorFileDirectory
    fix: "On v12 a relative file name lands in the root of the Files area (tested). Absolute and UNC paths were not tested; treat them as a risk. Prefer LogOutput for diagnostics."

  - id: MIG-005
    severity: info
    phase: build
    applies_to: process
    title: Cube logging toggles removed
    detect: (covered by TI-011) Process relies on switching cube logging off for speed
    fix: Plan load windows without it; it is not available on v12.6.3
